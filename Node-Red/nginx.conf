events {
    #1024 conexiones simultáneas permitidas
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://node-red:1880; # Nombre del servicio en Docker
            proxy_http_version 1.1;
            
            # Configuraciones necesarias para WebSockets (vital para Node-RED)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Cabeceras para que Node-RED sepa quién se conecta
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}