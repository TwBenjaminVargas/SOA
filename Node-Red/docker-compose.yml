services:
  node-red:
    image: nodered/node-red:4.1.7
    container_name: node-red
    restart: unless-stopped
    volumes:
      - node_red_data:/data
    # No exponemos el puerto 1880 al exterior, NGINX lo hará por nosotros

  nginx:
    image: nginx:1.23.3
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-red

volumes:
  node_red_data: